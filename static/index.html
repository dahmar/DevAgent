<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>DevAgent</title>
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #0f172a);
        color: var(--text);
      }

      .app {
        max-width: 900px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 24px 16px 80px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .tab {
        min-height: 40px;
        padding: 0 16px;
        background: transparent;
        color: var(--muted);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .tab.active {
        background: var(--accent);
        color: #06243b;
        border-color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
      }

      .badge {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.15);
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .chat {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      }

      .messages {
        min-height: 300px;
        max-height: 55vh;
        overflow-y: auto;
        padding: 20px;
      }

      .msg {
        margin-bottom: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        max-width: 85%;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .user {
        margin-left: auto;
        background: #0ea5e9;
        color: white;
      }

      .agent {
        background: #1f2937;
        color: var(--text);
      }

      .progress {
        background: rgba(56, 189, 248, 0.08);
        border-left: 3px solid var(--accent);
        color: #bae6fd;
        font-family: monospace;
        font-size: 13px;
      }

      .system {
        background: rgba(251, 191, 36, 0.12);
        border-left: 3px solid #fbbf24;
        color: #fef3c7;
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 16px;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.9);
      }

      .projects-panel {
        display: none;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      }

      .projects-panel.visible { display: block; }

      .projects-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .projects-heading h2 { margin: 0; font-size: 1.2rem; }

      .refresh {
        min-height: 36px;
        padding: 0 12px;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .project-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
      }

      .project-card {
        padding: 16px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 12px;
        background: rgba(31, 41, 55, 0.75);
      }

      .project-card h3 { margin: 0 0 8px; font-size: 1rem; }
      .project-card p { margin: 0; color: var(--muted); font-size: 13px; }
      .empty { color: var(--muted); margin: 0; }

      textarea {
        flex: 1;
        min-height: 52px;
        max-height: 150px;
        resize: vertical;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }

      button {
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #06243b;
        font-weight: 700;
        padding: 0 18px;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .header {
          align-items: flex-start;
          gap: 12px;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>DevAgent</h1>
        <div class="badge">AI Builder</div>
      </div>

      <div class="tabs" role="tablist" aria-label="Разделы">
        <button class="tab active" id="chat-tab" role="tab" aria-selected="true">Чат</button>
        <button class="tab" id="projects-tab" role="tab" aria-selected="false">Проекты</button>
      </div>

      <div class="chat" id="chat-panel">
        <div class="messages" id="messages">
          <div class="msg agent">Привет! Я могу создавать сайты, приложения и простые игры. Скажи, что хочешь сделать.</div>
        </div>
        <div class="composer">
          <textarea id="prompt" placeholder="Например: создай сайт портфолио или игру на Canvas..."></textarea>
          <button id="send">Отправить</button>
        </div>
      </div>

      <section class="projects-panel" id="projects-panel" aria-labelledby="projects-tab">
        <div class="projects-heading">
          <h2>Проекты в workspace</h2>
          <button class="refresh" id="refresh-projects" title="Обновить список">Обновить</button>
        </div>
        <div class="project-list" id="project-list" aria-live="polite">
          <p class="empty">Загрузка проектов...</p>
        </div>
      </section>
    </div>

    <script>
      const messages = document.getElementById('messages');
      const prompt = document.getElementById('prompt');
      const sendButton = document.getElementById('send');
      const chatTab = document.getElementById('chat-tab');
      const projectsTab = document.getElementById('projects-tab');
      const chatPanel = document.getElementById('chat-panel');
      const projectsPanel = document.getElementById('projects-panel');
      const projectList = document.getElementById('project-list');
      const refreshProjects = document.getElementById('refresh-projects');

      function showTab(tab) {
        const showProjects = tab === 'projects';
        chatPanel.style.display = showProjects ? 'none' : '';
        projectsPanel.classList.toggle('visible', showProjects);
        chatTab.classList.toggle('active', !showProjects);
        projectsTab.classList.toggle('active', showProjects);
        chatTab.setAttribute('aria-selected', String(!showProjects));
        projectsTab.setAttribute('aria-selected', String(showProjects));
        if (showProjects) loadProjects();
      }

      async function loadProjects() {
        projectList.innerHTML = '<p class="empty">Загрузка проектов...</p>';
        try {
          const response = await fetch('/api/projects');
          if (!response.ok) throw new Error('Не удалось загрузить проекты');
          const { projects } = await response.json();
          if (!projects.length) {
            projectList.innerHTML = '<p class="empty">Проектов пока нет.</p>';
            return;
          }
          projectList.innerHTML = projects.map((project) => `
            <article class="project-card">
              <h3>${escapeHtml(project.name)}</h3>
              <p>${escapeHtml(project.type)} · файлов: ${project.files}</p>
            </article>
          `).join('');
        } catch (error) {
          projectList.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[character]));
      }

      function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      function addProgress(text) {
        let progress = document.getElementById('active-progress');
        if (!progress) {
          progress = document.createElement('div');
          progress.id = 'active-progress';
          progress.className = 'msg progress';
          messages.appendChild(progress);
        }
        progress.textContent += (progress.textContent ? '\n' : '') + '> ' + text;
        messages.scrollTop = messages.scrollHeight;
      }

      function finishProgress() {
        const progress = document.getElementById('active-progress');
        if (progress) progress.removeAttribute('id');
      }

      async function sendMessage() {
        const text = prompt.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        prompt.value = '';
        sendButton.disabled = true;
        addProgress('Подключаюсь к журналу выполнения...');

        try {
          const response = await fetch('/api/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });

          if (!response.ok || !response.body) throw new Error('Сервер не вернул поток событий');
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          while (true) {
            const { value, done } = await reader.read();
            buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
            const events = buffer.split('\n\n');
            buffer = events.pop();
            for (const event of events) {
              const line = event.split('\n').find((item) => item.startsWith('data: '));
              if (!line) continue;
              const data = JSON.parse(line.slice(6));
              if (data.type === 'answer') {
                finishProgress();
                addMessage(data.text, 'agent');
              } else if (data.type === 'error') {
                finishProgress();
                addMessage(data.text, 'system');
              } else {
                addProgress(data.text);
              }
            }
            if (done) break;
          }
        } catch (error) {
          finishProgress();
          addMessage('Ошибка: ' + error.message, 'system');
        } finally {
          sendButton.disabled = false;
        }
      }

      sendButton.addEventListener('click', sendMessage);
      chatTab.addEventListener('click', () => showTab('chat'));
      projectsTab.addEventListener('click', () => showTab('projects'));
      refreshProjects.addEventListener('click', loadProjects);
      prompt.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
